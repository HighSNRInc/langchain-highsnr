[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-highsnr"
version = "0.2.0"
description = "LangChain integration for HighSNR — compress documents to a token budget, keeping the highest-signal content."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "HighSNR", email = "hello@high-snr.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]
dependencies = [
    "langchain-core>=0.3.0,<2",
    "requests>=2.32.0",
]

[project.urls]
Homepage = "https://www.high-snr.com"
Documentation = "https://www.high-snr.com/#api"
Repository = "https://github.com/HighSNRInc/langchain-highsnr"
Issues = "https://github.com/HighSNRInc/langchain-highsnr/issues"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.2",
    "types-requests",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
