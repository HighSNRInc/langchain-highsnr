[project]
name = "langchain-highsnr"
version = "0.1.0"
description = "LangChain integration for HighSNR — compress documents to a token budget, keeping the highest-signal content."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=0.3.0,<2",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.2",
    "types-requests",
]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
